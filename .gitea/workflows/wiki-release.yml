name: Generate Wiki Release from Git Log

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required secrets and environment variables
        run: |
          set -euo pipefail
          : "${{ secrets.WIKI_TOKEN:?WIKI_TOKEN is required}}"
          : "${GITEA_REPOSITORY:?GITEA_REPOSITORY missing}"
          : "${GITEA_ACTOR:?GITEA_ACTOR missing}"
          : "${GITEA_SERVER_URL:?GITEA_SERVER_URL missing}"

      - name: Resolve release metadata
        id: vars
        run: |
          set -euo pipefail
          VERSION="${GITEA_REF#refs/tags/}"
          DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          SHORT_SHA="$(echo "$GITEA_SHA" | cut -c1-7)"

          echo "version=$VERSION" >> "$GITEA_OUTPUT"
          echo "date=$DATE" >> "$GITEA_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITEA_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail

          PREV_TAG="$(git tag --sort=-creatordate | grep -v "^${{ steps.vars.outputs.version }}$" | head -n 1 || true)"
          echo "prev_tag=$PREV_TAG" >> "$GITEA_OUTPUT"

          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG..${{ steps.vars.outputs.version }}" \
              --pretty=format:"- %s" > changelog.txt
          else
            git log --pretty=format:"- %s" > changelog.txt
          fi

          if grep -qi "BREAKING" changelog.txt; then
            echo "breaking=true" >> "$GITEA_OUTPUT"
          else
            echo "breaking=false" >> "$GITEA_OUTPUT"
          fi

      - name: Docker login (Gitea registry)
        run: |
          echo "${{ secrets.WIKI_TOKEN }}" | \
            docker login git.k2labs.in \
            -u "$GITEA_ACTOR" \
            --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE="git.k2labs.in/${GITEA_REPOSITORY#*/}:${{ steps.vars.outputs.version }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Clone Wiki
        run: |
          git clone \
            https://$GITEA_ACTOR:${{ secrets.WIKI_TOKEN }}@git.k2labs.in/${GITEA_REPOSITORY}.wiki.git \
            wiki

      - name: Generate Wiki release page
        run: |
          set -euo pipefail

          PREV_TAG="${{ steps.changelog.outputs.prev_tag }}"
          BREAKING_FLAG="${{ steps.changelog.outputs.breaking }}"

          if [ "$BREAKING_FLAG" = "true" ]; then
            BREAKING_NOTICE="⚠️ **Breaking changes included in this release**"
          else
            BREAKING_NOTICE=""
          fi

          if [ -n "$PREV_TAG" ]; then
            COMPARE_LINK="🔗 [Compare with previous release](https://git.k2labs.in/${GITEA_REPOSITORY}/compare/${PREV_TAG}...${{ steps.vars.outputs.version }})"
          else
            COMPARE_LINK=""
          fi

          mkdir -p wiki/Releases

          cat <<EOF > wiki/Releases/${{ steps.vars.outputs.version }}.md
# Release ${{ steps.vars.outputs.version }} 🎉

## 📦 Release Metadata
- **Version:** ${{ steps.vars.outputs.version }}
- **Released on:** ${{ steps.vars.outputs.date }}
- **Triggered by:** @${GITEA_ACTOR} 🙂
- **Commit:** ${{ steps.vars.outputs.sha }}

## ✨ Highlights
$BREAKING_NOTICE  
$COMPARE_LINK

## 📝 Changes
$(cat changelog.txt)

## 🐳 Artifacts
- Docker image: \`git.k2labs.in/${GITEA_REPOSITORY#*/}:${{ steps.vars.outputs.version }}\`

---

## 📘 Developer Guide
Commit and tagging rules used to generate this release are documented here:

➡️ **COMMIT_GUIDE.md** (repository root)

---

🤖 **Automation Notice**

This page was automatically generated by **Gitea Actions**  
- Workflow: \`.gitea/workflows/wiki-release.yml\`
- Source: Git commit history between tags  
- Manual edits are discouraged
EOF

      - name: Update latest release pointer
        run: |
          cat <<EOF > wiki/Releases/latest.md
# 🚀 Latest Release

**${{ steps.vars.outputs.version }}**

- Docker image: \`git.k2labs.in/${GITEA_REPOSITORY#*/}:${{ steps.vars.outputs.version }}\`

See full release notes:
- [[${{ steps.vars.outputs.version }}]]
EOF

      - name: Commit and push Wiki
        run: |
          cd wiki
          git config user.name "gitea-actions 🤖"
          git config user.email "actions@k2labs.in"
          git add .
          git commit -m "docs: generate release wiki for ${{ steps.vars.outputs.version }}"
          git push
